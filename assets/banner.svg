<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Camila Sabino</title>
  <desc id="desc">Software Engineer in Argentina. Full-stack, backend, distributed systems, and architecture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1f1d"/>
      <stop offset="58%" stop-color="#102826"/>
      <stop offset="100%" stop-color="#12332f"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#2dd4bf" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="300" rx="20"/>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="9" height="300" fill="#2dd4bf"/>
    <text x="1152" y="268" text-anchor="end" fill="#2dd4bf" fill-opacity="0.13" font-family="Noto Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="112" font-weight="700">&lt;/&gt;</text>
    <text x="72" y="128" font-family="Noto Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="64">
      <tspan fill="#b7efe4" font-weight="400">Hi, I'm </tspan>
      <tspan fill="#ffffff" font-weight="700">Camila Sabino</tspan>
    </text>
    <text x="72" y="190" font-family="Noto Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="34">
      <tspan fill="#2dd4bf" font-weight="700">$</tspan>
      <tspan fill="#d8f7f1" font-weight="400"> Software Engineer &#183; Argentina</tspan>
    </text>
  </g>
</svg>
